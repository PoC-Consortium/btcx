[workspace]
resolver = "2"
members = [
    "params-btcx",
    "keys-btcx",
    "seedstore",
    "electrum-btcx",
    "wallet-btcx",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/PoC-Consortium/btcx"

[workspace.dependencies]
params-btcx = { path = "params-btcx" }
keys-btcx = { path = "keys-btcx" }
seedstore = { path = "seedstore" }
electrum-btcx = { path = "electrum-btcx" }
wallet-btcx = { path = "wallet-btcx" }

# Bitcoin stack — versions must stay mutually compatible (all on bitcoin 0.32).
bitcoin = { version = "0.32", features = ["serde", "rand-std"] }
# rusqlite feature: bdk's sqlite persister (bundled libsqlite3-sys).
bdk_wallet = { version = "2", features = ["rusqlite"] }
electrum-client = "0.21"
# electrum-btcx dials Electrum ssl:// itself (accept-any-cert verifier);
# host applications may install their own process CryptoProvider first.
rustls = "0.23"
bech32 = "0.11"
bip39 = "2"

scrypt = { version = "0.11", default-features = false }
chacha20poly1305 = "0.10"
# OS keystore for the unattended seed-at-rest wrap (#120). Only the native
# backends — Windows Credential Manager + macOS Keychain — no external C deps
# (Linux Secret Service is deliberately not used; see seedstore's target gate).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
hex = "0.4"
