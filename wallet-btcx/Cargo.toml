[package]
name = "wallet-btcx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BDK on-chain wallet for Bitcoin and Bitcoin PoCX (BTCX): BIP-84/BIP-86 wallets synced over electrum-btcx, sqlite-persisted, with send/RBF/CPFP and capped address handout"

[features]
# Swap-funding primitives: build-and-hold funding txs with input
# reservation, cancel/release, and wallet-change-output discovery.
# Expressed in generic address/amount/script terms — no swap-engine types.
swap-support = []

[dependencies]
electrum-btcx = { workspace = true }
params-btcx = { workspace = true }
keys-btcx = { workspace = true }
anyhow = { workspace = true }
bitcoin = { workspace = true }
bdk_wallet = { workspace = true }
bech32 = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }
